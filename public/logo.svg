<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="640" height="180">
  <defs>
    <linearGradient id="hBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="50%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#0F5132"/>
    </linearGradient>
    <linearGradient id="hGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="hShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#064E3B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- LOGOMARK CONTAINER (120x120 at x=30, y=30) -->
  <g transform="translate(30, 30)">
    <rect width="120" height="120" rx="32" fill="url(#hBgGrad)" filter="url(#hShadow)"/>
    <rect x="2" y="2" width="116" height="116" rx="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>

    <!-- U Growth Arc -->
    <path d="M 36 38 L 36 64 C 36 82 47 94 60 94 C 73 94 84 82 84 64 L 84 52" 
          fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arrowhead -->
    <path d="M 72 50 L 84 37 L 96 50" 
          fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Golden Margin Coin -->
    <circle cx="60" cy="57" r="14" fill="url(#hGoldGrad)"/>
    <circle cx="60" cy="57" r="11" fill="none" stroke="#FEF3C7" stroke-width="1.5"/>
    <path d="M 56.5 52 L 56.5 62 M 56.5 52 L 61 52 C 63 52 64.5 53.5 64.5 55.5 C 64.5 57.5 63 59 61 59 L 56.5 59 M 60 59 L 63.5 62" 
          fill="none" stroke="#78350F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- WORDMARK: UntunginLOH -->
  <g transform="translate(175, 45)">
    <!-- Untungin -->
    <text x="0" y="70" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="800" fill="#0F172A" letter-spacing="-1.5">Untungin</text>
    
    <!-- Badge LOH! -->
    <g transform="translate(305, 12)">
      <rect x="0" y="4" width="140" height="60" rx="16" fill="#15803D"/>
      <rect x="1" y="5" width="138" height="58" rx="15" fill="none" stroke="#86EFAC" stroke-width="2" stroke-opacity="0.5"/>
      <text x="70" y="48" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">LOH!</text>
    </g>
  </g>
</svg>